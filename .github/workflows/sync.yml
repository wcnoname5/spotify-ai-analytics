name: sync

# Hourly Spotify sync + static dashboard deploy. State (history.db, tokens.db)
# lives in a private R2 bucket — nothing personal ever enters this repo or its
# public logs (sync.py prints row counts only; secret values are auto-masked).
# R2 download/upload and the Pages deploy all use one CLOUDFLARE_API_TOKEN
# (Workers R2 Storage: Edit + Cloudflare Pages: Edit). Setup: docs/DEPLOY.md.
# Manual test-bed running the same steps against a test bucket: sync-test.yml.
# Note: the cron only fires when this file is on the default branch (main).

on:
  schedule:
    - cron: "23 * * * *" # hourly, off the top-of-hour congestion window
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV: "true" # DB paths resolve to ./data in the checkout (see paths.py)
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      # must match the user_id rows inside the uploaded tokens.db/history.db
      SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID || 'default' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Download DBs from R2
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/history.db" --file data/history.db --remote
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/tokens.db" --file data/tokens.db --remote

      - name: Sync from Spotify API
        run: uv run scripts/sync.py

      - name: Build static dashboard
        run: uv run scripts/build_dashboard.py

      # tokens.db goes back too — Spotify may rotate the refresh token
      - name: Upload DBs back to R2
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/history.db" --file data/history.db --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/tokens.db" --file data/tokens.db --remote

      - name: Deploy to Cloudflare Pages (production)
        run: >
          npx --yes wrangler@4 pages deploy site
          --project-name="${{ secrets.CF_PAGES_PROJECT }}"
          --branch=main --commit-dirty=true
