name: sync

# Manual-fallback Spotify sync -> D1.
# The hourly cron moved to the Cloudflare Worker's scheduled() handler
# (worker/src/sync.ts, crons = ["7 * * * *"]). Keep this workflow_dispatch-only
# path as a manual fallback; don't re-add `schedule` — two writers race on
# Spotify refresh-token rotation.

on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPOTIFY_MCP_DATA_DIR: ./data
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID || 'default' }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev
      - name: Sync from Spotify API to D1
        run: uv run python scripts/sync.py

      - name: Print D1 row count
        run: |
          uv run python -c "
          import os
          from spotify_core.db.worker_client import WorkerClient
          with WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_AUTH_TOKEN']) as worker:
              print(f'listening_history row count: {worker.get_tracks_count()}')
          "
