name: sync

# Hourly Spotify sync -> D1.
# Setup: docs/DEPLOY.md. Trust this one only after a `sync-test.yml` dry run
# turns green. Note: the cron only fires when this file is on the default
# branch (main).

on:
  schedule:
    - cron: "23 * * * *" # hourly, off the top-of-hour congestion window
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPOTIFY_MCP_DATA_DIR: ./data
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID || 'default' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker unit tests
        working-directory: worker
        run: npm test

      - name: Deploy Worker (production)
        working-directory: worker
        run: npx wrangler deploy

      - name: Apply D1 migrations (production)
        working-directory: worker
        run: npx wrangler d1 migrations apply spotify-analytics --remote

      - name: Sync from Spotify API to D1
        run: uv run python scripts/sync.py

      - name: Print D1 row count
        run: |
          uv run python -c "
          import os
          from spotify_core.db.worker_client import WorkerClient
          with WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_AUTH_TOKEN']) as worker:
              print(f'listening_history row count: {worker.get_tracks_count()}')
          "

      # Backup: export the full D1 database and drop it in R2. This is a
      # backup copy only — D1 (via the Worker) remains the source of truth;
      # nothing ever reads this dump back in.
      - name: Export D1 to backup.sql
        working-directory: worker
        run: npx wrangler d1 export spotify-analytics --remote --output backup.sql

      - name: Upload D1 backup to R2
        working-directory: worker
        run: npx wrangler r2 object put "${{ secrets.R2_BACKUP_BUCKET }}/backup.sql" --file backup.sql --remote
