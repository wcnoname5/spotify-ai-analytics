name: sync-test

# Manual test-bed for the cloud sync pipeline — run it from the Actions tab
# against the throwaway `spotify-test` R2 bucket before trusting the hourly
# sync.yml. Differences from sync.yml:
#   - workflow_dispatch only: no cron, never triggered by pushes
#   - bucket name is a run input (default spotify-test), not a secret
#   - R2 download/upload via wrangler + CLOUDFLARE_API_TOKEN (needs the
#     "Workers R2 Storage: Edit" permission) — no S3 access-key pair
#   - Pages deploy goes to the *preview* branch "test", never production
# Same public-repo log rules as sync.yml: row counts only, no track names.
# sync.yml runs these exact steps hourly against the real bucket — a green
# run here means the production pipeline works.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: R2 bucket to test against
        required: true
        default: spotify-test

concurrency:
  group: sync-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV: "true" # DB paths resolve to ./data in the checkout (see paths.py)
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      # must match the user_id rows inside the uploaded tokens.db/history.db
      SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID || 'default' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ inputs.bucket }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Download DBs from R2
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/history.db" --file data/history.db --remote
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/tokens.db" --file data/tokens.db --remote

      - name: Sync from Spotify API
        run: uv run scripts/sync.py

      - name: Build static dashboard
        run: uv run scripts/build_dashboard.py

      # tokens.db goes back too — Spotify may rotate the refresh token
      - name: Upload DBs back to R2
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/history.db" --file data/history.db --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/tokens.db" --file data/tokens.db --remote

      - name: Deploy dashboard preview to Cloudflare Pages
        run: >
          npx --yes wrangler@4 pages deploy site
          --project-name="${{ secrets.CF_PAGES_PROJECT }}"
          --branch=test --commit-dirty=true
