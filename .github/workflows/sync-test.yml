name: sync-test

# Manual test-bed for the D1 sync pipeline — run it from the Actions tab
# against the throwaway `spotify-analytics-test` D1 database before trusting
# the hourly sync.yml. Differences from sync.yml:
#   - workflow_dispatch only: no cron, never triggered by pushes
#   - targets the `[env.test]` Worker (spotify-analytics-test D1 binding)
# Deploy the test Worker locally first: cd worker && npx wrangler deploy --env test
# Same public-repo log rules as sync.yml: row counts only, no track names or
# tokens. A green run here means the production pipeline (sync.yml) will work.

on:
  workflow_dispatch:

concurrency:
  group: sync-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPOTIFY_MCP_DATA_DIR: ./data
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID || 'default' }}
      WORKER_URL: ${{ secrets.WORKER_TEST_URL }}
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_TEST_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - name: Sync from Spotify API to D1
        run: uv run python scripts/sync.py

      - name: Print D1 row count
        run: |
          uv run python -c "
          import os
          from spotify_core.db.worker_client import WorkerClient
          with WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_AUTH_TOKEN']) as worker:
              print(f'listening_history row count: {worker.get_tracks_count()}')
          "
