# Python tests across the supported range, plus the TS tests and Worker typecheck.
#
# The project declares requires-python = ">=3.12", so we test the floor (3.12)
# and the current dev version (3.13). Keep this matrix in sync with the
# requires-python lower bound in the pyproject.toml files.

name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the workspace (locked)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  # The shared-ts/@sql invariants are vitest tests; without this job CI never ran them.
  # ponytail: no cargo job — Tauri needs webkit system libs on Linux; add a windows job if Rust tests start catching things.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx vue-tsc --noEmit && npm test
        working-directory: apps/tauri
      - run: npm ci && npm run typecheck
        working-directory: worker
