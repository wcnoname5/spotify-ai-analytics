# Publish spotify-analytics-* packages to PyPI via trusted publishers (OIDC).
#
# Trigger: push a tag matching  v*  (e.g.  git tag v0.2.0 && git push --tags)
#
# Pre-release tags (PEP 440: aN, bN, rcN, .devN, .postN) only publish to
# TestPyPI — use them to smoke-test the workflow without burning a real
# version number on PyPI. Examples:  v0.2.0rc1, v0.2.0a1, v0.2.0b2
# Stable tags (e.g. v0.2.0) publish to both TestPyPI and PyPI.
#
# Version bump workflow:
#   1. uv run python scripts/bump.py 0.2.0   (or: scripts/bump.py 0.2.0rc1)
#   2. Commit: "chore: bump version to 0.2.0"
#   3. Tag:    git tag v0.2.0
#   4. Push:   git push && git push --tags
#
# Prerequisites — register SIX trusted publishers (3 on PyPI + 3 on TestPyPI):
#
#   On PyPI (https://pypi.org/manage/account/publishing/):
#     Project name                  | Owner      | Repo                  | Workflow       | Environment
#     spotify-analytics-core        | wcnoname5  | spotify-ai-analytics  | publish.yaml   | pypi-core
#     spotify-analytics-dataloader  | wcnoname5  | spotify-ai-analytics  | publish.yaml   | pypi-dataloader
#     spotify-analytics-mcp         | wcnoname5  | spotify-ai-analytics  | publish.yaml   | pypi-mcp
#
#   On TestPyPI (https://test.pypi.org/manage/account/publishing/):
#     spotify-analytics-core        | wcnoname5  | spotify-ai-analytics  | publish.yaml   | testpypi-core
#     spotify-analytics-dataloader  | wcnoname5  | spotify-ai-analytics  | publish.yaml   | testpypi-dataloader
#     spotify-analytics-mcp         | wcnoname5  | spotify-ai-analytics  | publish.yaml   | testpypi-mcp

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  # ── Detect whether this tag is a PEP 440 pre-release ───────────────
  # Pre-release tags (v0.2.0rc1, v0.2.0a1, v0.2.0b1, v0.2.0.dev1) only
  # publish to TestPyPI; stable tags publish to both.
  detect-prerelease:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - id: check
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pre-release tag ${GITHUB_REF_NAME} — skipping PyPI publish."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Stage 1: Build all three packages ──────────────────────────────
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build all packages into dist/
        run: |
          uv build packages/core       --out-dir dist/
          uv build packages/dataloader  --out-dir dist/
          uv build apps/mcp            --out-dir dist/

      - name: List built artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # ── Stage 2: Publish to TestPyPI (one job per package) ─────────────
  testpypi-core:
    name: TestPyPI — core
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi-core
      url: https://test.pypi.org/p/spotify-analytics-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_core-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/

  testpypi-dataloader:
    name: TestPyPI — dataloader
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi-dataloader
      url: https://test.pypi.org/p/spotify-analytics-dataloader
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_dataloader-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/

  testpypi-mcp:
    name: TestPyPI — mcp
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi-mcp
      url: https://test.pypi.org/p/spotify-analytics-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_mcp-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/

  # ── Stage 3: Publish to PyPI (one job per package) ─────────────────
  pypi-core:
    name: PyPI — core
    needs: [testpypi-core, detect-prerelease]
    if: needs.detect-prerelease.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/p/spotify-analytics-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_core-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  pypi-dataloader:
    name: PyPI — dataloader
    needs: [testpypi-dataloader, detect-prerelease]
    if: needs.detect-prerelease.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi-dataloader
      url: https://pypi.org/p/spotify-analytics-dataloader
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_dataloader-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  pypi-mcp:
    name: PyPI — mcp
    # mcp depends on core and dataloader at runtime; wait until they're on
    # PyPI so `pip install spotify-analytics-mcp` can resolve its deps.
    needs: [testpypi-mcp, pypi-core, pypi-dataloader, detect-prerelease]
    if: needs.detect-prerelease.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi-mcp
      url: https://pypi.org/p/spotify-analytics-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: mkdir -p upload && cp dist/spotify_analytics_mcp-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
