[project]
name = "spotify-web"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.35",
    "plotly>=5.0",
    "spotify-core",
    "spotify-dataloader",
]

[tool.uv.sources]
spotify-core = { workspace = true }
spotify-dataloader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_web"]
