[project]
name = "spotify-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "spotify-core",
    "spotify-dataloader",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.0",
]

[project.scripts]
spotify-mcp = "spotify_mcp.cli:app"

[tool.uv.sources]
spotify-core = { workspace = true }
spotify-dataloader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_mcp"]
