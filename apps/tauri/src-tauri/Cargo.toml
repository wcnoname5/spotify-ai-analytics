[package]
name = "spotify-analytics"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotify_analytics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2.5.9"
rfd = "0.15"
# Only for the Fernet key in config.rs. A full crypto crate would be a heavier
# dependency for one call to the OS RNG.
getrandom = "0.3"
# Cloudflare's REST API (cloudflare.rs). Blocking, because the deploy already runs
# on the blocking pool and streams progress as it goes. tauri-plugin-http pulls
# reqwest in anyway, so this shares the build rather than adding a stack.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }

