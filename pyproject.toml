[project]
name = "spotify-ai-analytics"
version = "0.1.0"
description = "A LangGraph-based AI agent for analyzing Spotify listening history using LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core==1.2.5",
    "langchain-google-genai>=4.1.2",
    "langchain-openai==1.1.6",
    "langgraph==1.0.5",
    "langfuse>=3.0",
    "loguru>=0.7",
    "numpy>=2.4.0",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # `dotenv` (the shim package) removed: python-dotenv is what provides `import dotenv`.
    "python-dotenv==1.2.1",
    # workspace members — ensures uv sync at the root installs all transitive deps
    "spotify-analytics-core",
    "spotify-analytics-mcp",
]

# The root is a workspace container, not a distributable package — it only exists
# to pin shared deps and list members. `package = false` replaces the old
# setuptools + `packages.find where = []` no-op-package hack.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "hatchling>=1.25",
    "pytest>=9.0.2",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "apps/mcp",
]

[tool.uv.sources]
spotify-analytics-core = { workspace = true }
spotify-analytics-mcp = { workspace = true }
