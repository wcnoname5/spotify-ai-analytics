[project]
name = "spotify-ai-analytics"
version = "0.1.0"
description = "Python workspace for Spotify AI Analytics: listening-history queries and a LangChain report agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # workspace member — the [report] extra carries the LangChain/Langfuse stack
    "spotify-analytics-core[report]",
]

# The root is a workspace container, not a distributable package — it only exists
# to list members and the dev tools.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pytest>=9.0.2",
]

[tool.uv.workspace]
members = [
    "packages/core",
]

[tool.uv.sources]
spotify-analytics-core = { workspace = true }
